<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Doondo — Legal</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#F5F8FC;color:#0F172A;min-height:100vh;display:flex;
    align-items:center;justify-content:center;padding:24px}
  .card{background:#fff;border-radius:20px;max-width:380px;width:100%;
    padding:36px 28px;box-shadow:0 8px 30px rgba(15,23,42,.08);text-align:center}
  .wordmark{font-size:22px;font-weight:800;color:#2563EB;letter-spacing:-.5px;margin-bottom:6px}
  .sub{font-size:14px;color:#64748B;margin-bottom:28px}
  a.link{display:block;text-decoration:none;background:#F1F5F9;border-radius:14px;
    padding:16px 18px;margin-bottom:12px;font-size:15px;font-weight:600;color:#1E293B;
    text-align:left}
  a.link span{display:block;font-size:12px;font-weight:400;color:#64748B;margin-top:3px}
  .foot{margin-top:22px;font-size:11px;color:#94A3B8}
</style>
</head>
<body>
  <div class="card">
    <div class="wordmark">Doondo</div>
    <div class="sub">Legal documents</div>
    <a class="link" href="/legal/privacy-policy.html">Privacy Policy<span>How we collect and use your data</span></a>
    <a class="link" href="/legal/terms-of-service.html">Terms of Service<span>The rules for using Doondo</span></a>
    <div class="foot">Doondo · doondo.app</div>
  </div>
</body>
</html>
