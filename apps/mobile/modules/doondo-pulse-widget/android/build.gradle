apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'app.doondo.pulsewidget'
version = '1.0.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()

// android {} MUST run before useExpoPublishing() — useExpoPublishing() runs
// `android { publishing { singleVariant("release") {...} } }` synchronously
// the moment it's called, which needs compileSdk already set on the android
// extension to register the "release" variant/component. Calling it before
// this block (as the old ordering did) is exactly what produced:
//   "project ':doondo-pulse-widget' does not specify compileSdk"
//   "Could not get unknown property 'release' for SoftwareComponent container"
android {
  namespace "app.doondo.pulsewidget"
  compileSdk 36
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

useExpoPublishing()
