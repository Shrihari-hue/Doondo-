  <g transform="translate(220 196) scale(0.88)">
    <ellipse cx="0" cy="150" rx="26" ry="8" fill="#0B2A66" opacity="0.14"/>
    <path d="M0 150 C-30 96 -42 70 -42 40 A42 42 0 1 1 42 40 C42 70 30 96 0 150 Z"
