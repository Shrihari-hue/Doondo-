  <g transform="translate(220 150)">
    <path d="M-72 176 Q-72 80 0 80 Q72 80 72 176 Z" fill="#8B97AD"/>
    <path d="M-72 176 Q-72 80 0 80 L0 176 Z" fill="#76839B"/>
    <path d="M-27 84 L27 84 L17 116 L-17 116 Z" fill="#69768E"/>
    <rect x="-17" y="46" width="34" height="42" rx="14" fill="#E0A074"/>
    <circle cx="0" cy="14" r="49" fill="#F2BE92"/>
    <ellipse cx="0" cy="-12" rx="60" ry="15" fill="#E0991C"/>
    <ellipse cx="0" cy="-34" rx="44" ry="39" fill="url(#hatY)"/>
    <rect x="-6" y="-78" width="12" height="14" rx="4" fill="#E0991C"/>
    <circle cx="-18" cy="18" r="5.6" fill="#3A2A1E"/>
    <circle cx="18" cy="18" r="5.6" fill="#3A2A1E"/>
    <path d="M-16 39 Q0 53 16 39" stroke="#3A2A1E" stroke-width="5.6" stroke-linecap="round" fill="none"/>
    <circle cx="-31" cy="34" r="7" fill="#F2A6A6" opacity="0.5"/>
    <circle cx="31" cy="34" r="7" fill="#F2A6A6" opacity="0.5"/>
