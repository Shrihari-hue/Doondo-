<svg width="440" height="360" viewBox="0 0 440 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="disc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF1FD"/>
      <stop offset="1" stop-color="#D7E5FB"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4F92FF"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="hatY" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD24D"/>
      <stop offset="1" stop-color="#F2AE1B"/>
    </linearGradient>
    <linearGradient id="hatO" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9F45"/>
      <stop offset="1" stop-color="#EC7A23"/>
    </linearGradient>
  </defs>

  <!-- soft backdrop disc -->
  <circle cx="220" cy="186" r="150" fill="url(#disc)"/>

  <!-- faint city skyline -->
  <g opacity="0.5">
    <rect x="96" y="150" width="34" height="86" rx="4" fill="#C6D9F4"/>
    <rect x="138" y="118" width="40" height="118" rx="4" fill="#BDD3F1"/>
    <rect x="264" y="130" width="38" height="106" rx="4" fill="#BDD3F1"/>
    <rect x="308" y="158" width="34" height="78" rx="4" fill="#C6D9F4"/>
    <rect x="146" y="132" width="9" height="9" rx="2" fill="#E7F0FD"/>
    <rect x="162" y="132" width="9" height="9" rx="2" fill="#E7F0FD"/>
    <rect x="272" y="144" width="9" height="9" rx="2" fill="#E7F0FD"/>
    <rect x="272" y="164" width="9" height="9" rx="2" fill="#E7F0FD"/>
  </g>

  <!-- ground shadow -->
  <ellipse cx="220" cy="314" rx="142" ry="20" fill="#0B2A66" opacity="0.07"/>

  <!-- ===== WORKER LEFT (orange hat, behind) ===== -->
  <g transform="translate(108 176) scale(0.8)">
    <path d="M-58 156 Q-58 74 0 74 Q58 74 58 156 Z" fill="#13A77C"/>
    <path d="M-58 156 Q-58 74 0 74 L0 156 Z" fill="#0E8A64"/>
    <rect x="-14" y="50" width="28" height="34" rx="12" fill="#D69B6E"/>
    <circle cx="0" cy="28" r="41" fill="#E8B385"/>
    <ellipse cx="0" cy="6" rx="50" ry="13" fill="#D9762A"/>
    <ellipse cx="0" cy="-12" rx="37" ry="33" fill="url(#hatO)"/>
    <rect x="-5" y="-46" width="10" height="12" rx="3" fill="#D9762A"/>
    <circle cx="-15" cy="32" r="4.6" fill="#3A2A1E"/>
    <circle cx="15" cy="32" r="4.6" fill="#3A2A1E"/>
    <path d="M-12 48 Q0 58 12 48" stroke="#3A2A1E" stroke-width="4.6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- ===== WORKER RIGHT (yellow hat, behind) ===== -->
  <g transform="translate(332 180) scale(0.78)">
    <path d="M-58 156 Q-58 74 0 74 Q58 74 58 156 Z" fill="#7C5CDB"/>
    <path d="M0 74 Q58 74 58 156 L0 156 Z" fill="#6A48C9"/>
    <rect x="-14" y="50" width="28" height="34" rx="12" fill="#C68A5E"/>
    <circle cx="0" cy="28" r="41" fill="#D49C6C"/>
    <ellipse cx="0" cy="6" rx="50" ry="13" fill="#E0991C"/>
    <ellipse cx="0" cy="-12" rx="37" ry="33" fill="url(#hatY)"/>
    <rect x="-5" y="-46" width="10" height="12" rx="3" fill="#E0991C"/>
    <circle cx="-15" cy="32" r="4.6" fill="#3A2A1E"/>
    <circle cx="15" cy="32" r="4.6" fill="#3A2A1E"/>
    <path d="M-12 48 Q0 58 12 48" stroke="#3A2A1E" stroke-width="4.6" stroke-linecap="round" fill="none"/>
