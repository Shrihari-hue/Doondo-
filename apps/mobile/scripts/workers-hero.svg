    <circle cx="0" cy="38" r="17" fill="#FFFFFF"/>
    <circle cx="0" cy="38" r="7.5" fill="#2F6BF0"/>
    <ellipse cx="-11" cy="22" rx="8" ry="5" fill="#FFFFFF" opacity="0.34"/>
  </g>
</svg>
